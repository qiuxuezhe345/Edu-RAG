<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WebSocket 测试页面</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f6fa;
            color: #2d3436;
            padding: 24px;
        }
        .container { max-width: 720px; margin: 0 auto; }

        h1 { font-size: 22px; margin-bottom: 4px; }
        .sub { color: #636e72; font-size: 13px; margin-bottom: 20px; }

        .card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }
        .card-title { font-size: 15px; font-weight: 600; margin-bottom: 14px; }

        .row { display: flex; gap: 8px; align-items: center; }
        input[type="text"] {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #0984e3; }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            color: #fff;
            transition: opacity 0.15s;
        }
        button:hover { opacity: 0.85; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-connect  { background: #0984e3; }
        .btn-disconnect { background: #d63031; }
        .btn-send     { background: #00b894; }

        /* 连接状态 */
        .status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            background: #dfe6e9;
            color: #636e72;
        }
        .status.connected { background: #55efc4; color: #00b894; }
        .status.connecting { background: #ffeaa7; color: #fdcb6e; }
        .status.closed { background: #fab1a0; color: #d63031; }

        /* 消息日志 */
        .log {
            height: 300px;
            overflow-y: auto;
            background: #2d3436;
            border-radius: 8px;
            padding: 12px;
            font-family: "SF Mono", Menlo, Consolas, monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        .log-item { margin-bottom: 6px; word-break: break-all; }
        .log-item .time { color: #636e72; margin-right: 8px; }
        .log-sent   { color: #74b9ff; }
        .log-recv   { color: #55efc4; }
        .log-system { color: #dfe6e9; font-style: italic; }
        .log-error  { color: #ff7675; }
    </style>
</head>
<body>
<div class="container">
    <h1>WebSocket 客户端测试页面</h1>
    <p class="sub">对应后端接口：<code>tests/fastapi_test.py</code> 中的 <code>/ws</code> 长连接</p>

    <!-- 连接设置 -->
    <div class="card">
        <div class="card-title">连接设置</div>
        <div class="row">
            <input type="text" id="wsUrl" value="ws://127.0.0.1:8000/ws" placeholder="WebSocket 地址">
            <button id="btnConnect" class="btn-connect" onclick="connect()">连接</button>
            <button id="btnDisconnect" class="btn-disconnect" onclick="disconnect()" disabled>断开</button>
            <span id="status" class="status">未连接</span>
        </div>
    </div>

    <!-- 消息发送 -->
    <div class="card">
        <div class="card-title">发送消息</div>
        <div class="row">
            <input type="text" id="msgInput" placeholder="输入要发送的消息，回车发送" disabled>
            <button id="btnSend" class="btn-send" onclick="sendMsg()" disabled>发送</button>
        </div>
    </div>

    <!-- 消息日志 -->
    <div class="card">
        <div class="card-title">消息日志</div>
        <div class="log" id="log"></div>
    </div>
</div>

<script>
    let ws = null;

    const $ = (id) => document.getElementById(id);

    function log(type, text) {
        const now = new Date();
        const time = now.toTimeString().slice(0, 8);
        const item = document.createElement('div');
        item.className = 'log-item ' + (type === 'sent' ? 'log-sent'
            : type === 'recv' ? 'log-recv'
            : type === 'error' ? 'log-error'
            : 'log-system');
        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.textContent = `[${time}]`;
        const textSpan = document.createElement('span');
        textSpan.textContent = text;
        item.appendChild(timeSpan);
        item.appendChild(textSpan);
        const logEl = $('log');
        logEl.appendChild(item);
        logEl.scrollTop = logEl.scrollHeight;
    }

    function setStatus(state, text) {
        const statusEl = $('status');
        statusEl.textContent = text;
        statusEl.className = 'status ' + state;
    }

    function setEnabled(connected) {
        $('btnConnect').disabled = connected;
        $('btnDisconnect').disabled = !connected;
        $('btnSend').disabled = !connected;
        $('msgInput').disabled = !connected;
        if (connected) $('msgInput').focus();
    }

    function connect() {
        const url = $('wsUrl').value.trim();
        if (!url) {
            log('error', '请输入 WebSocket 地址');
            return;
        }
        setStatus('connecting', '连接中...');
        log('system', `正在连接 ${url} ...`);

        ws = new WebSocket(url);

        ws.onopen = () => {
            setStatus('connected', '已连接');
            setEnabled(true);
            log('system', '连接成功');
        };

        ws.onmessage = (event) => {
            log('recv', `服务器：${event.data}`);
        };

        ws.onerror = (event) => {
            setStatus('closed', '连接异常');
            setEnabled(false);
            log('error', '连接发生错误');
        };

        ws.onclose = (event) => {
            setStatus('closed', '已断开');
            setEnabled(false);
            log('system', `连接已关闭 (code=${event.code} reason=${event.reason || '无'})`);
            ws = null;
        };
    }

    function disconnect() {
        if (ws) ws.close();
    }

    function sendMsg() {
        const input = $('msgInput');
        const msg = input.value.trim();
        if (!msg) return;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            log('error', '连接未建立，无法发送');
            return;
        }
        ws.send(msg);
        log('sent', `我：${msg}`);
        input.value = '';
        input.focus();
    }

    // 回车发送
    $('msgInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') sendMsg();
    });
    // 连接地址处回车直接连接
    $('wsUrl').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') connect();
    });
</script>
</body>
</html>
