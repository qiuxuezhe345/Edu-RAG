<html lang="zh-CN">
<head>

<title>知问学伴 | 智能学习助手</title>
<style>
  :root {
    --primary: #ff6a00;
    --primary-dark: #e05f00;
    --primary-soft: #fff3e8;
    --bg: #f0f2f5;
    --panel: #ffffff;
    --text: #1f2329;
    --text-secondary: #6b7280;
    --border: #e5e7eb;
    --user-bubble: #ff6a00;
    --user-text: #ffffff;
    --assistant-bubble: #ffffff;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
    --radius: 12px;
    --header-h: 60px;
    --sidebar-w: 264px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100%;
    overflow: hidden;
  }

  /* ============ 顶部导航 ============ */
  .header {
    height: var(--header-h);
    background: linear-gradient(135deg, #ff6a00 0%, #ff8e33 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    box-shadow: 0 2px 8px rgba(255, 106, 0, .35);
    flex-shrink: 0;
    z-index: 100;
  }

  .header-left { display: flex; align-items: center; gap: 12px; }

  .icon-btn {
    border: none; background: rgba(255,255,255,.22); color: #fff;
    border-radius: 8px; width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; transition: background .15s ease;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: rgba(255,255,255,.38); }
  .sidebar-toggle { display: none; }

  .logo {
    width: 36px; height: 36px;
    background: #fff;
    color: var(--primary);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 18px;
  }

  .header-title { font-size: 18px; font-weight: 600; }

  .header-sub { font-size: 12px; opacity: .85; margin-top: 1px; }

  .header-right { display: flex; align-items: center; gap: 10px; }

  .toolbar {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 8px;
    padding: 4px 8px;
  }

  .toolbar label { font-size: 13px; opacity: .95; }

  .subject-select {
    background: #fff; color: var(--text);
    border: none; border-radius: 6px;
    padding: 5px 8px; font-size: 13px;
    outline: none; max-width: 140px; cursor: pointer;
  }

  .btn {
    border: none; border-radius: 8px;
    padding: 7px 14px; font-size: 13px;
    cursor: pointer; transition: all .15s ease;
    background: rgba(255,255,255,.22);
    color: #fff; display: inline-flex; align-items: center; gap: 5px;
  }
  .btn:hover { background: rgba(255,255,255,.35); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ============ 主布局：侧边栏 + 聊天区 ============ */
  .layout { flex: 1; display: flex; min-height: 0; }

  .sidebar {
    width: var(--sidebar-w);
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    flex-shrink: 0;
    min-height: 0;
  }

  .sidebar-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 14px 10px;
  }
  .sidebar-title { font-size: 14px; font-weight: 600; color: var(--text); }
  .sidebar-new {
    background: var(--primary-soft); color: var(--primary);
    border: 1px solid rgba(255,106,0,.25); border-radius: 8px;
    padding: 5px 12px; font-size: 12px; cursor: pointer;
    transition: all .15s ease;
  }
  .sidebar-new:hover { background: #ffe7cf; }

  .sidebar-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }

  .sidebar-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px; border-radius: 10px;
    cursor: pointer; margin-bottom: 2px;
    transition: background .15s ease;
  }
  .sidebar-item:hover { background: var(--bg); }
  .sidebar-item.active { background: var(--primary-soft); }

  .sidebar-item .s-avatar {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #ff6a00, #ff8e33);
    color: #fff; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 16px;
  }
  .sidebar-item .s-body { flex: 1; min-width: 0; }
  .sidebar-item .s-title {
    font-size: 13px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sidebar-item .s-meta {
    font-size: 11px; color: var(--text-secondary); margin-top: 2px;
    display: flex; justify-content: space-between;
  }
  .sidebar-item .s-del {
    border: none; background: transparent; color: #c9cdd4;
    font-size: 13px; cursor: pointer; padding: 2px 5px; border-radius: 6px;
    flex-shrink: 0; opacity: 0; transition: all .15s ease;
  }
  .sidebar-item:hover .s-del { opacity: 1; }
  .sidebar-item .s-del:hover { color: #ef4444; background: #fee2e2; }

  .sidebar-empty {
    text-align: center; color: var(--text-secondary);
    font-size: 13px; line-height: 1.9; padding: 40px 10px;
  }

  .main-col {
    flex: 1; display: flex; flex-direction: column;
    min-width: 0; min-height: 0;
  }

  /* ============ 聊天主体 ============ */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px 16px;
    scroll-behavior: smooth;
  }

  .chat-inner { max-width: 860px; margin: 0 auto; }

  /* 欢迎 / 空状态 */
  .welcome {
    text-align: center;
    padding: 60px 20px 40px;
    color: var(--text-secondary);
  }
  .welcome .icon { font-size: 56px; margin-bottom: 16px; }
  .welcome h2 { color: var(--text); margin-bottom: 10px; font-size: 22px; }
  .welcome p { font-size: 14px; line-height: 1.8; }

  .welcome .chips {
    margin-top: 20px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  }
  .welcome .chip {
    background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 8px 16px; border-radius: 20px;
    font-size: 13px; cursor: pointer; transition: all .15s ease;
    box-shadow: var(--shadow);
  }
  .welcome .chip:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }

  /* 消息气泡 */
  .msg { display: flex; margin-bottom: 20px; align-items: flex-start; gap: 10px; }

  .msg .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 18px; color: #fff;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar { background: var(--primary); }
  .msg.assistant .avatar { background: linear-gradient(135deg, #ff6a00, #ff8e33); }

  .msg .bubble {
    max-width: 76%;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 15px;
    line-height: 1.7;
    word-break: break-word;
    white-space: pre-wrap;
    box-shadow: var(--shadow);
  }
  .msg.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-top-right-radius: 4px;
  }
  .msg.assistant .bubble {
    background: var(--assistant-bubble);
    border-top-left-radius: 4px;
    color: var(--text);
  }

  .msg .meta { font-size: 11px; color: var(--text-secondary); margin-top: 5px; }

  /* Markdown 增强 */
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble code {
    background: rgba(0,0,0,.06);
    padding: 2px 6px; border-radius: 4px;
    font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .bubble pre {
    background: #1e1e2e; color: #e6e6e6;
    padding: 12px 14px; border-radius: 8px;
    overflow-x: auto; font-size: 13px; line-height: 1.6;
    margin: 8px 0;
  }
  .bubble pre code { background: none; padding: 0; color: inherit; }
  .bubble strong { font-weight: 600; }
  .bubble h3, .bubble h4 { margin: 10px 0 6px; font-size: 15px; }
  .bubble ul, .bubble ol { margin: 4px 0 8px; padding-left: 22px; }

  /* 打字指示 */
  .typing .bubble { display: inline-flex; gap: 4px; padding: 14px 18px; }
  .typing .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #c9cdd4; animation: blink 1.2s infinite;
  }
  .typing .dot:nth-child(2) { animation-delay: .2s; }
  .typing .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .25; transform: scale(.85);} 40% { opacity: 1; transform: scale(1);} }

  /* ============ 输入区 ============ */
  .input-area {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  .input-box {
    max-width: 860px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 10px;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 8px 8px 14px;
    background: var(--bg);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .input-box:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(255,106,0,.15);
    background: #fff;
  }
  .input-box textarea {
    flex: 1; border: none; outline: none; resize: none;
    background: transparent;
    font-size: 15px; line-height: 1.6;
    color: var(--text); max-height: 120px; padding: 6px 0;
    font-family: inherit;
  }
  .input-box textarea::placeholder { color: #9ca3af; }

  .send-btn {
    background: var(--primary);
    color: #fff; border: none; border-radius: 10px;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: all .15s ease; flex-shrink: 0;
  }
  .send-btn:hover { background: var(--primary-dark); }
  .send-btn:active { transform: scale(.94); }
  .send-btn:disabled { background: #d1d5db; cursor: not-allowed; }

  .input-hint {
    max-width: 860px; margin: 6px auto 0;
    font-size: 12px; color: #9ca3af; text-align: center;
  }

  .toast {
    position: fixed; top: calc(var(--header-h) + 16px); left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: rgba(0,0,0,.78); color: #fff;
    padding: 10px 18px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 滚动条 */
  .chat::-webkit-scrollbar, .bubble pre::-webkit-scrollbar, .sidebar-list::-webkit-scrollbar { width: 8px; height: 8px; }
  .chat::-webkit-scrollbar-thumb, .bubble pre::-webkit-scrollbar-thumb, .sidebar-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
  .chat::-webkit-scrollbar-track, .bubble pre::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 768px) {
    .sidebar {
      position: fixed; left: 0; top: var(--header-h); bottom: 0;
      z-index: 50; transform: translateX(-100%);
      transition: transform .25s ease;
      box-shadow: 2px 0 12px rgba(0,0,0,.12);
    }
    body.sidebar-open .sidebar { transform: translateX(0); }
    .sidebar-toggle { display: inline-flex; }
    .header-sub, .toolbar label { display: none; }
    .msg .bubble { max-width: 84%; }
    .welcome .icon { font-size: 44px; }
  }
  @media (max-width: 480px) {
    #clearBtn { display: none; }
  }
</style>

    .input-hint { display: none; }
  }

  @media (max-width: 460px) {
    .header-right { gap: 5px; padding-right: 8px; }
    .header-left { gap: 8px; padding-left: 8px; }
    .logo { display: none; }
    .toolbar { border: 0; background: transparent; padding: 0; }
    .subject-select { min-width: 92px; max-width: 96px; }
    #clearBtn { display: none; }
    .welcome h2 { font-size: 27px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

  <header class="header">
    <div class="header-left">
      <button id="sidebarToggle" class="icon-btn sidebar-toggle" title="历史会话">☰</button>
      <div class="logo" aria-hidden="true">知</div>
      <div>
        <div class="header-title">知问学伴</div>
        <div class="header-sub">知识库与文档融合的智能学习助手</div>
      </div>
    </div>
    <div class="header-right">
      <div class="toolbar" title="按学科过滤检索范围">
        <label>学科</label>
        <select id="subjectSelect" class="subject-select">
          <option value="">全部学科</option>
        </select>
      </div>
      <button id="newSessionBtn" class="btn" title="开启新的对话会话" aria-label="新会话">＋<span>新会话</span></button>
      <button id="clearBtn" class="btn" title="清除当前会话的历史记录" aria-label="清除当前会话">×<span>清除</span></button>
    </div>
  </header>

  <div class="layout">
    <!-- 左侧历史会话列表 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">历史会话</span>
        <button id="newChatBtn" class="sidebar-new">＋ 新建对话</button>
      </div>
      <div class="sidebar-list" id="sessionList"></div>
    </aside>

    <!-- 右侧聊天区 -->
    <section class="main-col">
      <main class="chat" id="chat">
        <div class="chat-inner" id="chatInner">
          <div class="welcome" id="welcome">
            <div class="icon">知问</div>
            <h2>把疑问变成理解</h2>
            <p>你好，我是知问学伴。你可以直接提出学习问题，或先选择学科范围，让知识库检索更聚焦。</p>
            <div class="chips" id="suggestChips"></div>
          </div>
        </div>
      </main>

      <footer class="input-area">
        <div class="input-box">
          <textarea id="input" rows="1" placeholder="输入你的问题，按 Enter 发送，Shift + Enter 换行"></textarea>
          <button class="send-btn" id="sendBtn" title="发送" aria-label="发送问题">↑</button>
        </div>
        <div class="input-hint">内容由大模型生成，仅供学习参考 | 支持知识库命中与文档检索</div>
      </footer>
    </section>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  const chatEl = document.getElementById('chat');
  const chatInner = document.getElementById('chatInner');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const subjectSelect = document.getElementById('subjectSelect');
  const newSessionBtn = document.getElementById('newSessionBtn');
  const clearBtn = document.getElementById('clearBtn');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sessionListEl = document.getElementById('sessionList');
  const newChatBtn = document.getElementById('newChatBtn');
  const suggestChips = document.getElementById('suggestChips');
  const toastEl = document.getElementById('toast');

  const WELCOME_HTML =
    '<div class="icon">知问</div>' +
    '<h2>把疑问变成理解</h2>' +
    '<p>你好，我是知问学伴。你可以直接提出学习问题，或先选择学科范围，让知识库检索更聚焦。</p>' +
    '<div class="chips" id="suggestChips"></div>';

  const WS_URL = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/stream';
  let sessionId = null;
  let streaming = false;
  let sources = [];
  let sessions = [];   // 左侧会话列表 [{id, title, time, count}]

  // ---------- 工具函数 ----------
  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // 轻量 Markdown 渲染：代码块 / 行内代码 / 加粗 / 标题 / 列表 / 换行
  function renderMarkdown(text) {
    const escaped = escapeHtml(text);
    let html = escaped;

    // 代码块（优先处理）
    html = html.replace(/```([\s\S]*?)```/g, function (m, code) {
      return '<pre>' + code.trim() + '</pre>';
    });

    // 行内代码
    html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');

    // 标题
    html = html.replace(/^#### (.*)$/gm, '<h4>$1</h4>');
    html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');

    // 加粗
    html = html.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');

    // 无序列表
    html = html.replace(/^[-*] (.*)$/gm, '• $1');

    // 段落化：按空行分块
    const blocks = html.split(/\n{2,}/).map(function (b) {
      b = b.trim();
      if (!b) return '';
      if (/^<pre>/.test(b)) return b;
      if (/^<h[34]>/.test(b)) return b;
      return '<p>' + b.replace(/\n/g, '<br>') + '</p>';
    }).join('');

    return blocks || html.replace(/\n/g, '<br>');
  }

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  function scrollToBottom() {
    requestAnimationFrame(function () { chatEl.scrollTop = chatEl.scrollHeight; });
  }

  function setInputDisabled(disabled) {
    inputEl.disabled = disabled;
    sendBtn.disabled = disabled;
  }

  function nowStr() {
    const d = new Date();
    const p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
           ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  // 将 "YYYY-MM-DD HH:MM:SS" 精简为 "MM-DD HH:MM"
  function displayTime(str) {
    if (!str) return '';
    return str.length >= 16 ? str.substring(5, 16) : str;
  }

  // ---------- 会话管理 ----------
  async function createSession() {
    const res = await fetch('/api/create_session', { method: 'POST' });
    if (!res.ok) throw new Error('创建会话失败: HTTP ' + res.status);
    const data = await res.json();
    sessionId = data.session_id;
    try { localStorage.setItem('edurag_session', sessionId); } catch (e) {}
    return sessionId;
  }

  // 重建聊天区（欢迎页 / 空状态）
  function resetMessages() {
    chatInner.innerHTML = '';
    const w = document.createElement('div');
    w.className = 'welcome';
    w.id = 'welcome';
    w.innerHTML = WELCOME_HTML;
    chatInner.appendChild(w);
    renderChips();
  }

  function removeWelcome() {
    const w = document.getElementById('welcome');
    if (w && w.parentNode) w.parentNode.removeChild(w);
  }

  function addMessage(role, content) {
    removeWelcome();
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + role;
    wrap.innerHTML =
      '<div class="avatar">' + (role === 'user' ? '你' : '知') + '</div>' +
      '<div><div class="bubble">' + renderMarkdown(content) + '</div></div>';
    chatInner.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function loadHistory() {
    fetch('/api/history/' + sessionId)
      .then(function (res) { return res.json(); })
      .then(function (data) {
        const history = data.history || [];
        history.forEach(function (item) {
          if (item && item.question) addMessage('user', item.question);
          if (item && item.answer) addMessage('assistant', item.answer);
        });
        if (history.length) {
          removeWelcome();
          toast('已加载历史对话');
        }
      })
      .catch(function () { /* 无历史记录时静默处理 */ });
  }

  // ---------- 左侧历史会话列表 ----------
  function loadSessions() {
    fetch('/api/sessions')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        sessions = (data.sessions || []).map(function (s) {
          return {
            id: s.session_id,
            title: s.title || '新会话',
            time: s.updated_at || '',
            count: s.message_count || 0
          };
        });
        ensureCurrentInList();
        renderSessionList();
        saveSessionsLocal();
      })
      .catch(function () {
        // 接口不可用时回退到本地记录
        loadSessionsLocal();
        ensureCurrentInList();
        renderSessionList();
      });
  }

  function saveSessionsLocal() {
    try { localStorage.setItem('edurag_sessions', JSON.stringify(sessions)); } catch (e) {}
  }

  function loadSessionsLocal() {
    try {
      const raw = localStorage.getItem('edurag_sessions');
      sessions = raw ? JSON.parse(raw) : [];
    } catch (e) { sessions = []; }
  }

  // 保证当前会话始终出现在列表里（新建但还没产生记录的会话）
  function ensureCurrentInList() {
    if (!sessionId) return;
    const exists = sessions.some(function (s) { return s.id === sessionId; });
    if (!exists) {
      sessions.unshift({ id: sessionId, title: '新会话', time: '', count: 0 });
    }
  }

  function renderSessionList() {
    if (!sessions.length) {
      sessionListEl.innerHTML = '<div class="sidebar-empty">暂无历史会话<br>从一个问题开始</div>';
      return;
    }
    sessionListEl.innerHTML = sessions.map(function (s) {
      return '<div class="sidebar-item' + (s.id === sessionId ? ' active' : '') + '" data-id="' + escapeHtml(s.id) + '">' +
               '<div class="s-avatar">问</div>' +
               '<div class="s-body">' +
                 '<div class="s-title">' + escapeHtml(s.title) + '</div>' +
                 '<div class="s-meta">' +
                   '<span>' + displayTime(s.time) + '</span>' +
                   '<span>' + (s.count ? s.count + ' 轮' : '') + '</span>' +
                 '</div>' +
               '</div>' +
               '<button class="s-del" data-del="' + escapeHtml(s.id) + '" title="删除会话">✕</button>' +
             '</div>';
    }).join('');
  }

  // 切换会话：清空聊天区并加载对应历史
  function switchSession(id) {
    if (!id || id === sessionId) return;
    if (streaming) { toast('请等待当前回答完成'); return; }
    sessionId = id;
    try { localStorage.setItem('edurag_session', id); } catch (e) {}
    resetMessages();
    loadHistory();
    renderSessionList();
  }

  async function deleteSession(id) {
    if (!confirm('确定要删除该会话的全部历史记录吗？')) return;
    try {
      const res = await fetch('/api/history/' + id, { method: 'DELETE' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      sessions = sessions.filter(function (s) { return s.id !== id; });
      if (id === sessionId) {
        // 删除的是当前会话：重建聊天区并新建一个会话
        sessionId = null;
        resetMessages();
        await createSession();
        loadSessions();
        toast('已删除会话，并开启新对话');
      } else {
        renderSessionList();
        saveSessionsLocal();
        toast('会话已删除');
      }
    } catch (e) {
      toast('删除失败: ' + e.message);
    }
  }

  function newChat() {
    if (streaming) { toast('请等待当前回答完成'); return; }
    resetMessages();
    createSession().then(function () {
      loadSessions();
      toast('已开启新会话');
    }).catch(function (e) { toast(e.message); });
  }

  // 侧边栏点击：委托处理“删除”与“切换”
  sessionListEl.addEventListener('click', function (e) {
    const delBtn = e.target.closest('.s-del');
    if (delBtn) {
      e.stopPropagation();
      deleteSession(delBtn.getAttribute('data-del'));
      return;
    }
    const item = e.target.closest('.sidebar-item');
    if (item) switchSession(item.getAttribute('data-id'));
  });

  // ---------- 学科来源 ----------
  function renderChips() {
    const chips = sources.slice(0, 4);
    const el = document.getElementById('suggestChips');
    if (!el) return;
    el.innerHTML = chips.map(function (s) {
      return '<button type="button" class="chip" data-subject="' + escapeHtml(s) + '">咨询' + escapeHtml(s) + '问题</button>';
    }).join('');
  }

  function loadSources() {
    return fetch('/api/sources')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        sources = data.sources || [];
        subjectSelect.innerHTML = '<option value="">全部学科</option>';
        sources.forEach(function (s) {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          subjectSelect.appendChild(opt);
        });
        renderChips();
      })
      .catch(function () { toast('获取学科列表失败'); });
  }

  chatInner.addEventListener('click', function (event) {
    const chip = event.target.closest('#suggestChips .chip');
    if (!chip) return;
    const subject = chip.getAttribute('data-subject');
    if (!subject) return;
    subjectSelect.value = subject;
    inputEl.value = '我想了解 ' + subject + ' 相关的问题';
    inputEl.focus();
    autoResize();
  });

  // ---------- 发送 ----------
  function send() {
    const query = inputEl.value.trim();
    if (!query || streaming) return;
    if (!sessionId) { toast('会话未就绪，请稍候'); return; }

    addMessage('user', query);
    inputEl.value = '';
    autoResize();
    startStream(query);
  }

  function startStream(query) {
    streaming = true;
    setInputDisabled(true);

    // 添加助手消息框（先显示打字指示）
    removeWelcome();
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant';
    wrap.innerHTML =
      '<div class="avatar">知</div>' +
      '<div class="bubble typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
    chatInner.appendChild(wrap);
    scrollToBottom();

    const bubbleEl = wrap.querySelector('.bubble');
    let collected = '';
    let gotFirstToken = false;

    let ws;
    try {
      ws = new WebSocket(WS_URL);
    } catch (e) {
      fail('无法连接问答服务: ' + e.message);
      return;
    }

    const payload = JSON.stringify({
      query: query,
      source_filter: subjectSelect.value || null,
      session_id: sessionId
    });

    ws.onopen = function () { ws.send(payload); };

    ws.onmessage = function (ev) {
      let msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }

      if (msg.type === 'start') {
        // 会话 ID 可能由服务端生成，同步回来
        if (msg.session_id) {
          sessionId = msg.session_id;
          try { localStorage.setItem('edurag_session', sessionId); } catch (e) {}
        }
      } else if (msg.type === 'token' && typeof msg.token === 'string') {
        collected += msg.token;
        // 替换打字指示为内容，并流式刷新
        bubbleEl.classList.remove('typing');
        bubbleEl.innerHTML = renderMarkdown(collected);
        gotFirstToken = true;
        scrollToBottom();
      } else if (msg.type === 'end') {
        finish(collected, msg);
      } else if (msg.type === 'error') {
        fail(msg.error || '服务端错误');
      }
    };

    ws.onerror = function () {
      if (!gotFirstToken) fail('连接出错，请检查问答服务是否已启动');
    };

    ws.onclose = function () {
      // 若服务端未发 end 就关闭，做兜底收尾
      if (streaming && !finished) {
        if (collected) {
          bubbleEl.classList.remove('typing');
          bubbleEl.innerHTML = renderMarkdown(collected);
        } else {
          bubbleEl.classList.remove('typing');
          bubbleEl.textContent = '连接已断开，请重试';
        }
        finish(collected);
      }
    };

    let finished = false;
    function finish(answer, endMsg) {
      if (finished) return;
      finished = true;
      streaming = false;
      setInputDisabled(false);
      try { ws.close(); } catch (e) {}
      if (answer && answer.trim()) {
        bubbleEl.classList.remove('typing');
        bubbleEl.innerHTML = renderMarkdown(answer);
      } else if (endMsg && endMsg.is_complete && !answer) {
        bubbleEl.classList.remove('typing');
        bubbleEl.textContent = '（未获取到答案）';
      }
      if (endMsg && endMsg.processing_time != null) {
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = '耗时 ' + endMsg.processing_time.toFixed(2) + ' 秒';
        wrap.appendChild(meta);
      }
      // 回答完成，刷新左侧会话列表（标题/时间/轮数会变化）
      loadSessions();
      scrollToBottom();
      inputEl.focus();
    }

    function fail(errMsg) {
      if (finished) return;
      streaming = false;
      setInputDisabled(false);
      bubbleEl.classList.remove('typing');
      bubbleEl.textContent = '回答失败：' + errMsg;
      try { ws.close(); } catch (e) {}
      toast(errMsg);
      scrollToBottom();
      finished = true;
    }
  }

  // ---------- 输入框自适应高度 ----------
  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  }

  // ---------- 事件绑定 ----------
  inputEl.addEventListener('input', autoResize);
  inputEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  sendBtn.addEventListener('click', send);
  newSessionBtn.addEventListener('click', newChat);
  newChatBtn.addEventListener('click', newChat);
  sidebarToggle.addEventListener('click', function () {
    document.body.classList.toggle('sidebar-open');
  });

  clearBtn.addEventListener('click', async function () {
    if (!sessionId) return;
    if (!confirm('确定要清除当前会话的全部历史记录吗？')) return;
    try {
      const res = await fetch('/api/history/' + sessionId, { method: 'DELETE' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      resetMessages();
      loadSessions();
      toast('历史记录已清除');
    } catch (e) {
      toast('清除失败: ' + e.message);
    }
  });

  // ---------- 初始化 ----------
  async function init() {
    // 优先恢复上次会话
    let stored = null;
    try { stored = localStorage.getItem('edurag_session'); } catch (e) {}
    if (stored) {
      sessionId = stored;
      loadHistory();
    } else {
      await createSession();
    }
    loadSources();
    loadSessions();
    inputEl.focus();
  }

  init().catch(function (e) { toast('初始化失败: ' + e.message); });
})();
</script>
</body>
</html>
